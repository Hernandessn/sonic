<!DOCTYPE html>
<html lang="pt-Br">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./styles.css">
  <title>Sonic-Cronômetro</title>
</head>

<body>
  <!-- Painel do cronômetro acima do vídeo -->
  <div class="painel">
    <img src="./img/painel-sonic.png" alt="painel do sonic">
    <h3 class="segundos">0s</h3>
    <h1 class="minutes">0<p>min</p></h1>
    
    <h2 class="milisegundos">0ms</h2>
  </div>
  
  <!-- Área do vídeo -->
  <div class='caixa'>
    <video class="fundo" src="./img/image.fundo.mp4" autoplay loop></video>
    <video class="fundo1" src="" autoplay loop></video>
  </div>

  <!-- Botões abaixo do vídeo -->
  <div class="buttons">
    <button onclick="start()">Start</button>
    <button onclick="stop()">Stop</button>
    <button onclick="restart()">Restart</button>
  </div>

  <script src="./scripts.js"></script>
</body>

</html>
